{% extends "core/base.html" %}
{% block title %}{{ entity.name }} - Command Center{% endblock %}
{% block content %}
<div x-data="{ open: false }">
  <div class="mb-4 flex items-center justify-between">
    <h1 class="text-2xl font-semibold">{{ entity.name }} <span class="text-sm text-[var(--accent)]">{{ entity.kind }}</span></h1>
    <button type="button" class="rounded bg-[var(--accent)] px-3 py-1 font-semibold text-[var(--background)]" @click="open = !open">Add entry</button>
  </div>
  {% include "core/_entity_panel.html" %}
</div>
{% endblock %}
